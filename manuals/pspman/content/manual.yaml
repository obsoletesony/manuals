      {"type": "text", "text": "PSPMAN is an independent homebrew project and is not affiliated with or endorsed by Sony Group Corporation or Sony Interactive Entertainment."}
    ]},
    {"number": 15, "kind": "back-cover", "title": "PSPMAN"}
  ]
}
