{
  "document": {
    "title": "PSPMAN User's Guide",
    "code": "OS-PSPMAN-01 (4)",
    "description": "Walkman-inspired FLAC and MP3 music player for Sony PSP, built with PocketJS.",
    "subject": "User's guide for PSPMAN",
    "creator": "ObsoleteSony",
    "version": "0.1.0-alpha.6",
    "edition": "22 September 2026",
    "site": "obsoletesony.com/pspman",
    "repository": "https://github.com/obsoletesony/PSPMAN",
    "sourceRepository": "https://github.com/obsoletesony/manuals"
  },
  "pages": [
    {
      "number": 1,
      "kind": "cover",
      "title": "PSPMAN"
    },
    {
      "number": 2,
      "title": "Read this first",
      "density": "standard",
      "template": "standard-text",
      "blocks": [
        {
          "type": "text",
          "text": "PSPMAN is a Walkman-inspired FLAC and MP3 music player for Sony PSP. It scans compatible music on PSP storage and organizes it in a completely offline library."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "Requirements"
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "Supported models are PSP-1000, PSP-2000, PSP-3000, PSP Go, and PSP Street (E1000). PSP Go internal system storage is supported."
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "Custom firmware or another working homebrew environment is required. Use stereo 16-bit / 44.1 kHz FLAC or 44.1 kHz MPEG-1 Layer III MP3."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "Confirm and Back"
        },
        {
          "type": "text",
          "text": "PSPMAN follows the PSP system Cross/Circle assignment automatically. On Circle-confirm systems, CIRCLE confirms and CROSS goes back. On Cross-confirm systems, the roles are reversed. There is no PSPMAN override."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "Music files"
        },
        {
          "type": "text",
          "text": "PSPMAN does not retag, move, or delete source music files and does not require a network connection."
        }
      ]
    },
    {
      "number": 3,
      "title": "Table of Contents",
      "kind": "contents",
      "density": "standard",
      "template": "standard-text"
    },
    {
      "number": 4,
      "title": "Install and add music",
      "density": "dense",
      "template": "visual",
      "blocks": [
        {
          "type": "numbered-list",
          "items": [
            "Extract PSPMAN: Extract the package. Confirm that the PSPMAN folder contains EBOOT.PBP.",
            "Copy the application: On the Memory Stick, use PSP/GAME/PSPMAN/EBOOT.PBP.",
            "Copy music: On the same Memory Stick, copy supported FLAC or MP3 files to MUSIC or PSP/MUSIC.",
            "Disconnect safely: Eject the storage, then disconnect the USB cable or card reader.",
            "Start PSPMAN: On the XMB, open Game and start PSPMAN by ObsoleteSony.",
            "Finish the scan: Allow the first scan to finish. Restart PSPMAN after adding music."
          ]
        }
      ]
    },
    {
      "number": 5,
      "title": "Library",
      "density": "standard",
      "template": "visual",
      "blocks": [
        {
          "type": "screenshot",
          "file": "library-home-480x272.png",
          "width": 64
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "All Songs lists every compatible track."
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "Album and Artist group tracks by their stored metadata."
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "Folder follows the folder structure on your PSP storage."
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "Favorites contains tracks you marked with the star on Now Playing."
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "Recent contains your recent tracks. Playlists shows M3U and M3U8 playlists found during scanning."
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "The player strip shows the current track and Previous, Play/Pause, and Next controls."
        },
        {
          "type": "text",
          "text": "Use the D-pad to choose an item. Press the PSP system Confirm button to open a category or play a track. Press the system Back button to return."
        }
      ]
    },
    {
      "number": 6,
      "title": "Playback",
      "density": "standard",
      "template": "standard-text",
      "blocks": [
        {
          "type": "heading",
          "text": "Start playback"
        },
        {
          "type": "text",
          "text": "Choose a track in the Library and press the PSP system Confirm button. PSPMAN starts the track and creates a queue from the selected list."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "Basic controls"
        },
        {
          "type": "bullet",
          "spacing": "relaxed",
          "text": "Press START or activate Play/Pause to pause or resume."
        },
        {
          "type": "bullet",
          "spacing": "relaxed",
          "text": "Tap L for the previous track or R for the next track. Previous restarts the current track after three seconds of playback."
        },
        {
          "type": "bullet",
          "spacing": "relaxed",
          "text": "Hold L to rewind or R to fast-forward."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "Shuffle and repeat"
        },
        {
          "type": "text",
          "text": "Shuffle changes the order of the active queue. Repeat can repeat the queue or the current track. When a track ends, PSPMAN follows the active queue and Repeat setting."
        }
      ]
    },
    {
      "number": 7,
      "title": "Now Playing",
      "density": "standard",
      "template": "visual",
      "blocks": [
        {
          "type": "screenshot",
          "file": "now-playing-480x272.png",
          "width": 72
        },
        {
          "type": "bullet",
          "anchor": "secondary",
          "spacing": "compact",
          "text": "From Library Home, press SQUARE to open Now Playing."
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "Use the D-pad to move focus. Press the PSP system Confirm button to activate the focused control."
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "LYRICS appears when a matching local sidecar exists. SPEED is always available and shows the active rate when playback is not 1.0x."
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "Activate the star to add or remove the current track from Favorites."
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "Press TRIANGLE for the Spectrum Analyzer or SQUARE for Cassette View."
        }
      ]
    },
    {
      "number": 8,
      "title": "Spectrum Analyzer",
      "density": "standard",
      "template": "visual",
      "blocks": [
        {
          "type": "screenshot",
          "file": "spectrum-480x272.png",
          "width": 72
        },
        {
          "type": "bullet",
          "anchor": "secondary",
          "spacing": "compact",
          "text": "Press TRIANGLE on Now Playing to open the ten-band Spectrum Analyzer."
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "It visualizes live PCM at 31 Hz, 63 Hz, 125 Hz, 250 Hz, 500 Hz, 1 kHz, 2 kHz, 4 kHz, 8 kHz, and 16 kHz without changing the sound."
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "Press Left or Right to cycle Classic, Amber, Green, Monochrome, and Multicolor. The palette remains selected until exit and is separate from Cassette colors."
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "Tap L or R to change track. Press the PSP system Back button or TRIANGLE for Now Playing, or SQUARE for Cassette View."
        }
      ]
    },
    {
      "number": 9,
      "title": "Equalizer",
      "density": "dense",
      "template": "visual",
      "blocks": [
        {
          "type": "screenshot",
          "file": "eq-480x272.png",
          "width": 62
        },
        {
          "type": "bullet",
          "anchor": "secondary",
          "spacing": "compact",
          "text": "Open Equalizer from Library Home. Bands: 31, 62, 125, 250, 500, 1K, 2K, 4K, 8K, and 16K."
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "Left/Right selects bands and wraps through PREAMP at either end. Up/Down changes Custom bands -12..+12 dB (1 dB) or PREAMP -12.0..0.0 dB (0.5 dB)."
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "SQUARE toggles EQ; TRIANGLE cycles Flat, Bass, Treble, Vocal, Rock, Pop, Jazz, Classical. Band edits create Custom; PREAMP stays independent; all EQ state persists."
        }
      ]
    },
    {
      "number": 10,
      "title": "Synchronized Lyrics",
      "density": "standard",
      "template": "standard-text",
      "blocks": [
        {
          "type": "heading",
          "text": "Local .lrc sidecars"
        },
        {
          "type": "text",
          "text": "Put a UTF-8 .lrc file beside the MP3 or FLAC and give it the same base filename. PSPMAN checks the active track locally and never searches for or downloads lyrics online."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "Open and control Lyrics"
        },
        {
          "type": "text",
          "text": "When a matching sidecar exists, LYRICS appears on Now Playing. Focus it and press the PSP system Confirm button. In Lyrics, Left/Right changes color, Confirm pauses or resumes, and the system Back button returns to Now Playing."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "Supported LRC"
        },
        {
          "type": "text",
          "text": "Alpha 6 supports UTF-8 LRC with [mm:ss], [mm:ss.xx], or [mm:ss.xxx] timestamps, multiple timestamps on a line, optional signed [offset:] values, CRLF or LF, and Japanese or mixed-script text. Missing or malformed Lyrics never stop playback."
        }
      ]
    },
    {
      "number": 11,
      "title": "Playback Speed",
      "density": "standard",
      "template": "standard-text",
      "blocks": [
        {
          "type": "heading",
          "text": "SPEED pill"
        },
        {
          "type": "text",
          "text": "On Now Playing, focus SPEED and press the PSP system Confirm button to cycle 1.0x, 1.25x, 1.5x, 1.75x, and 2.0x. At 1.0x the pill reads SPEED; otherwise it shows the active rate."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "Behavior"
        },
        {
          "type": "text",
          "text": "PSPMAN preserves pitch. The selected global speed stays active across track changes and normal relaunches, composes with EQ, and 1.0x bypasses tempo processing."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "Performance note"
        },
        {
          "type": "text",
          "text": "Playback Speed is designed mainly for spoken audio such as audiobooks and podcasts. 2.0x also works with FLAC, but it can use a significant amount of the PSP's available processing headroom."
        }
      ]
    },
    {
      "number": 12,
      "title": "Cassette View",
      "density": "standard",
      "template": "visual",
      "blocks": [
        {
          "type": "screenshot",
          "file": "cassette-480x272.png",
          "width": 72
        },
        {
          "type": "bullet",
          "anchor": "secondary",
          "spacing": "relaxed",
          "text": "Press SQUARE on Now Playing to open Cassette View."
        },
        {
          "type": "bullet",
          "spacing": "relaxed",
          "text": "The reels move while music plays and stop when playback is paused."
        },
        {
          "type": "bullet",
          "spacing": "relaxed",
          "text": "Press Left or Right to choose a cassette color. PSPMAN remembers the choice across launches."
        },
        {
          "type": "bullet",
          "spacing": "relaxed",
          "text": "Press START or the PSP system Confirm button to play or pause."
        },
        {
          "type": "bullet",
          "spacing": "relaxed",
          "text": "Press the PSP system Back button or SQUARE to return to Now Playing."
        }
      ]
    },
    {
      "number": 13,
      "title": "Information, diagnostics, and safe exit",
      "density": "dense",
      "template": "standard-text",
      "blocks": [
        {
          "type": "heading",
          "text": "Track Information"
        },
        {
          "type": "text",
          "text": "Open Information and choose Track Information for file, metadata, and playback details. Use Left or Right, or L or R, to change page; Up or Down scrolls. Press the PSP system Back button to return."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "About"
        },
        {
          "type": "text",
          "text": "Press SELECT from a normal screen to open About. It shows PSPMAN version 0.1.0-alpha.6, the creator, website, copyright, and non-affiliation notice. Press the PSP system Back button to close it."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "Diagnostics"
        },
        {
          "type": "text",
          "text": "Use Diagnostics only when reporting a problem. Pause playback, return to Library, then hold TRIANGLE. Press the PSP system Back button to return. If a problem occurs, preserve PSPMAN-HW-DIAG.log before launching PSPMAN again."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "Safe exit"
        },
        {
          "type": "text",
          "text": "Press HOME to open the PSP exit dialog. Confirm the exit and allow PSPMAN to finish before removing storage or turning off the PSP."
        }
      ]
    },
    {
      "number": 14,
      "title": "Supported files and limits",
      "density": "standard",
      "template": "standard-text",
      "blocks": [
        {
          "type": "heading",
          "text": "Audio"
        },
        {
          "type": "text",
          "text": "PSPMAN accepts stereo 16-bit / 44.1 kHz FLAC. It also accepts MPEG-1 Layer III MP3 at 44.1 kHz, CBR or VBR, mono or stereo, through 320 kbps. 48 kHz MP3, MPEG-2, MPEG-2.5, and other audio codecs are not supported."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "Library and storage"
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "PSPMAN scans MUSIC and PSP/MUSIC on supported PSP storage, including PSP Go internal system storage."
        },
        {
          "type": "bullet",
          "spacing": "compact",
          "text": "The Library supports up to 1,000 compatible tracks and up to 12 folder levels."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "Artwork, Lyrics, and text"
        },
        {
          "type": "text",
          "text": "PSPMAN supports embedded JPEG and PNG cover art. Unsupported or damaged artwork may show No Cover without affecting playback. Synchronized Lyrics use optional matching UTF-8 .lrc sidecars. Alpha 6 substantially expands practical Japanese and mixed-script display coverage."
        }
      ]
    },
    {
      "number": 15,
      "title": "Troubleshooting: startup and library",
      "tocTitle": "Troubleshooting",
      "density": "standard",
      "template": "standard-text",
      "blocks": [
        {
          "type": "heading",
          "text": "PSPMAN does not appear or open"
        },
        {
          "type": "text",
          "text": "Confirm that EBOOT.PBP is in PSP/GAME/PSPMAN on PSP storage and that custom firmware or another homebrew environment is working. Alpha 6 supports PSP-1000, PSP-2000, PSP-3000, PSP Go, and PSP Street (E1000)."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "No songs found"
        },
        {
          "type": "text",
          "text": "Place supported FLAC or MP3 files in MUSIC or PSP/MUSIC on the storage you are using. Restart PSPMAN and allow the scan to finish."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "Confirm / Back feels reversed"
        },
        {
          "type": "text",
          "text": "PSPMAN follows the PSP system Cross/Circle assignment automatically. Change the system or CFW assignment if you want different Confirm/Back behavior; PSPMAN has no separate override."
        }
      ]
    },
    {
      "number": 16,
      "title": "Troubleshooting: artwork, Lyrics, and playback",
      "density": "standard",
      "template": "standard-text",
      "blocks": [
        {
          "type": "heading",
          "text": "Cover art is missing"
        },
        {
          "type": "text",
          "text": "Wait for the first cover load to finish. Unsupported or damaged artwork may show No Cover, but playback continues. Alpha 6 fixes same-track reselection so already loaded artwork is correctly republished instead of disappearing."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "LYRICS does not appear"
        },
        {
          "type": "text",
          "text": "Confirm that the .lrc file is UTF-8, is beside the audio file, and has exactly the same base filename."
        },
        {
          "type": "heading",
          "before": "section",
          "text": "Report a problem"
        },
        {
          "type": "text",
          "url": "https://obsoletesony.com/pspman/report-a-bug",
          "text": "After reproducing a problem, exit with HOME and preserve PSPMAN-HW-DIAG.log from the storage root before launching PSPMAN again. Report the PSP model, firmware, track format, and exact steps at obsoletesony.com/pspman/report-a-bug."
        }
      ]
    },
