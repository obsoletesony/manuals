name: Build PSPMAN Alpha 6 guides

on:
  push:
    branches:
      - alpha6-user-guide-prep

permissions:
  contents: write

jobs:
  build-guides:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha6-user-guide-prep
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check reportlab pypdf pillow pypdfium2
      - name: Generate EQ guide capture
        run: python manuals/pspman/source/generate_eq_guide_capture.py
      - name: Build and validate English guide
        run: |
          python manuals/pspman/source/build_manual.py
          python manuals/pspman/source/validate_manual.py --render --determinism
      - name: Build Japanese guide
        run: python manuals/pspman/source/build_manual.py --locale ja
      - name: Validate Japanese guide
        run: python manuals/pspman/source/validate_manual_ja.py
      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f manuals/pspman/assets/screenshots/eq-480x272.png
          git add -f manuals/pspman/output/*.pdf
          git add -f manuals/pspman/output/*.json
          git diff --cached --quiet && exit 0
          git commit -m "Build PSPMAN Alpha 6 user guides [skip ci]"
          git push origin HEAD:alpha6-user-guide-prep
